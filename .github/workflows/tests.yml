name: Python smoke tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: python -m pip install -e '.[test]'
      - name: Smoke tests
        run: python -m pytest -q
      - name: Command-line demo
        run: python -m physym demo --episodes 4
      - name: Short parity verification
        run: python -m physym verify --samples 12000
