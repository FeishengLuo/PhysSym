[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "physym-research"
version = "0.1.0"
description = "Physics-consistent graph learning and active symplectic testing for synthetic quantum circuit fault diagnosis"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "PhysSym contributors"}]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.11",
  "matplotlib>=3.8",
  "scikit-learn>=1.3",
  "torch>=2.2",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["physym*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
